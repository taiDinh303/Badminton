name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

# Fast static guard first — fails immediately if a secret leaked into the
# tree or the seed gate regressed. Cheap; runs in parallel with the rest.
jobs:
  ci-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and project references
        run: python scripts/Validate-Repository.py
      - name: Run static guard (seed + secrets + migration presence)
        shell: pwsh
        run: ./scripts/CiGuard.ps1

  build-and-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up SDK and target runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore Backend/Badminton.slnx
      - name: Build
        run: dotnet build Backend/Badminton.slnx -c Release --no-restore
      - name: Verify production configuration without external services
        shell: pwsh
        run: ./scripts/Test-ProductionConfiguration.ps1
      - name: Verify SQL Server migration model
        working-directory: Backend
        env:
          DOTNET_ENVIRONMENT: Testing
          Database__Provider: SqlServer
          JwtSettings__Key: 'badminton-ci-design-time-only-signing-key'
          DatabaseInitialization__MigrateOnStartup: 'false'
          DatabaseInitialization__SeedDemoData: 'false'
          BackgroundJobs__Enabled: 'false'
          ConnectionStrings__BadmintonBooking: 'Server=127.0.0.1;Database=BadmintonDesignTime;User Id=design_time;Password=design-time-only;TrustServerCertificate=True;Connect Timeout=1'
        run: dotnet ef migrations has-pending-model-changes --context BadmintonBookingDbContext --project Repositories --startup-project API --configuration Release --no-build
      - name: Verify PostgreSQL migration model
        working-directory: Backend
        env:
          DOTNET_ENVIRONMENT: Testing
          Database__Provider: PostgreSQL
          JwtSettings__Key: 'badminton-ci-design-time-only-signing-key'
          DatabaseInitialization__MigrateOnStartup: 'false'
          DatabaseInitialization__SeedDemoData: 'false'
          BackgroundJobs__Enabled: 'false'
          ConnectionStrings__BadmintonBooking: 'Host=127.0.0.1;Database=BadmintonDesignTime;Username=design_time;Password=design-time-only;Timeout=1'
        run: dotnet ef migrations has-pending-model-changes --context PostgresBookingDbContext --project Repositories --startup-project API --configuration Release --no-build

  test:
    needs: build-and-verify
    runs-on: windows-latest
    env:
      BADMINTON_TEST_SQLSERVER: '(localdb)\MSSQLLocalDB'
    steps:
      - uses: actions/checkout@v4
      - name: Set up SDK and target runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - name: Restore
        run: dotnet restore Backend/Badminton.slnx
      - name: Run service/database tests
        run: dotnet test Backend/Tests/Badminton.Tests.csproj -c Debug --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  # docs 04 §7 — E2E smoke via Playwright. The app is NOT running; all
  # API calls are intercepted by page.route() with mock BaseResponse
  # envelopes so the test suite is fully offline (no DB, no .NET runtime
  # required in the CI runner).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      # `webServer` serves the built SPA via `vite preview`, which requires a
      # prior build (dist/). Without this the preview server has nothing to
      # serve and Playwright's config.webServer times out after 120s.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: 'http://localhost:4173'
